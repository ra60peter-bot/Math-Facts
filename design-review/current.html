<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current Math Facts — isolated interface replay</title>
  <link rel="stylesheet" href="/current.css"><link rel="stylesheet" href="/redesign.css">
  <style>
    .audit-panel{position:fixed;bottom:12px;right:12px;z-index:1000;width:320px;max-width:calc(100vw - 24px);background:#17202e;color:#f8faff;border:2px solid #ffc663;border-radius:12px;box-shadow:0 8px 30px #0006;font:13px/1.45 system-ui,sans-serif}
    .audit-panel summary{padding:10px 14px;cursor:pointer;font-weight:750}.audit-panel .audit-content{padding:0 14px 14px}.audit-panel p{margin:8px 0}.audit-panel label{color:#e1e9fa;font-size:13px}.audit-panel select{min-width:0;width:100%;font-size:13px}.audit-panel button,.audit-panel a{font:inherit}.audit-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.audit-buttons button{padding:7px 9px;border:1px solid #aabddd;border-radius:6px;background:#263953;color:white;cursor:pointer}.audit-panel a{color:#b7d1ff}.audit-note{color:#ffdd9f}.audit-panel button:disabled{opacity:.45;cursor:default}
  </style>
</head><body><div id="root"></div><div id="audit-controls"></div><script defer src="/.build/current.js"></script></body>
</html>
